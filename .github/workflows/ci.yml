name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build compiled output
        run: npx tsc

      - name: Verify MCP server loads (43 tools)
        run: |
          node -e "
            const {listTools} = require('./scripts/compiled/tools/index.js');
            const t = listTools().tools;
            console.log(t.length + ' tools loaded');
            if (t.length < 43) { console.error('Expected >=43 tools, got ' + t.length); process.exit(1); }
          "

      - name: Verify CLI runs
        run: node scripts/vault_cli.js --help

      - name: Check JS syntax
        run: node --check scripts/vault_cli.js
