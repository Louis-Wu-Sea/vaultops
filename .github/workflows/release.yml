name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dev dependencies
        run: npm ci

      - name: Build dist
        run: npm run build

      - name: Package tarball
        run: |
          tar czf vaultops.tar.gz -C dist scripts skills
          sha256sum vaultops.tar.gz | awk '{print $1}' > vaultops.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            vaultops.tar.gz
            vaultops.tar.gz.sha256
